<!doctype html>
<html lang="en" data-theme="{{THEME}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{HEADLINE}}</title>
    <style>
      {{THEME_CSS}}
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        transition:
          background-color 0.6s ease,
          color 0.6s ease;
      }
      .stage {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 4vw;
        padding: 5vw 6vw;
        border-left: 1.2vw solid var(--accent);
        transition: border-color 0.6s ease;
      }
      main {
        flex: 1;
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-size: clamp(3rem, 13vw, 9rem);
        line-height: 1.04;
        font-weight: 800;
        letter-spacing: -0.02em;
        overflow-wrap: break-word;
      }
      p.subline {
        margin: 1.5rem 0 0;
        font-size: clamp(1.25rem, 3.4vw, 2.75rem);
        color: var(--accent);
        font-weight: 600;
        transition: color 0.6s ease;
      }
      /* "Follow along" QR card: projector-sized, hidden on phones (they're already here). */
      .qr-card {
        display: none;
        flex: none;
        width: 260px;
        padding: 16px;
        border-radius: 16px;
        background: #fff;
        color: #1c273a;
        text-align: center;
        font-weight: 700;
        font-size: 1.1rem;
        align-self: flex-end;
      }
      .qr-card img {
        display: block;
        width: 220px;
        height: 220px;
        margin: 10px auto 0;
        image-rendering: pixelated;
      }
      @media (min-width: 900px) {
        .qr-card {
          display: block;
        }
        /* Leave room for the QR card next to the headline. */
        h1 {
          font-size: clamp(3rem, 8vw, 9rem);
        }
      }
      /* Projector: a bigger QR so it scans from the back of the room. */
      @media (min-width: 1600px) {
        .qr-card {
          width: 320px;
        }
        .qr-card img {
          width: 288px;
          height: 288px;
        }
      }
      footer {
        padding: 1rem 6vw;
        font-size: 1.25rem;
        opacity: 0.9;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      footer b {
        color: var(--accent);
      }
      /* "Just deployed" moment */
      .toast {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 1rem 6vw;
        background: var(--accent);
        color: var(--bg);
        font-size: clamp(1.1rem, 2.4vw, 1.75rem);
        font-weight: 800;
        text-align: center;
        transform: translateY(-110%);
        transition: transform 0.4s ease;
        z-index: 10;
      }
      .toast.show {
        transform: translateY(0);
      }
      h1.just-deployed {
        animation: slide-in 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @keyframes slide-in {
        from {
          transform: translateX(-8%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        body,
        .stage,
        p.subline,
        .toast {
          transition: none;
        }
        h1.just-deployed {
          animation: none;
        }
      }
    </style>
  </head>
  <body data-build="{{BUILD}}">
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="stage">
      <main>
        <h1 id="headline">{{HEADLINE}}</h1>
        <p class="subline" id="subline">{{SUBLINE}}</p>
      </main>
      <aside class="qr-card">
        Follow along on your phone
        <img
          src="brand/qr-live-demo.png"
          width="220"
          height="220"
          alt="QR code that opens circleci-live-demo.vercel.app"
        />
      </aside>
    </div>
    <footer>
      Build <b id="stamp-build">#{{BUILD}}</b> &middot; commit <b id="stamp-sha">{{SHA}}</b> &middot;
      deployed <span id="stamp-time">{{DEPLOYED_AT}}</span>
    </footer>
    <script>
      // Live update: poll version.json and update the page in place when a new build lands.
      // Pauses while the tab is hidden and stops after 90 minutes, so idle phones stay cheap.
      (function () {
        var POLL_MS = 3000;
        var MAX_MS = 90 * 60 * 1000;
        var THEMES = ["midnight", "slime"];
        var started = Date.now();
        var current = document.body.getAttribute("data-build");
        var inflight = false;
        var toastTimer = null;

        function $(id) {
          return document.getElementById(id);
        }

        function showToast(build) {
          var toast = $("toast");
          toast.textContent = "Updated by build #" + build + ", just now";
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            toast.classList.remove("show");
          }, 5000);
        }

        function apply(v) {
          current = String(v.build);
          if (THEMES.indexOf(v.theme) !== -1) {
            document.documentElement.setAttribute("data-theme", v.theme);
          }
          var h1 = $("headline");
          h1.textContent = v.headline;
          $("subline").textContent = v.subline;
          document.title = v.headline;
          $("stamp-build").textContent = "#" + current;
          $("stamp-sha").textContent = v.sha;
          $("stamp-time").textContent = String(v.builtAt).replace("T", " ").slice(0, 16) + " UTC";
          h1.classList.remove("just-deployed");
          void h1.offsetWidth; // restart the animation
          h1.classList.add("just-deployed");
          showToast(current);
        }

        function check() {
          if (document.hidden || inflight) return;
          if (Date.now() - started > MAX_MS) {
            clearInterval(timer);
            return;
          }
          inflight = true;
          fetch("version.json?t=" + Date.now(), { cache: "no-store" })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (v) {
              if (v && String(v.build) !== current) apply(v);
            })
            .catch(function () {})
            .then(function () {
              inflight = false;
            });
        }

        var timer = setInterval(check, POLL_MS);
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) check();
        });
      })();
    </script>
  </body>
</html>
